<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#27272A" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <ellipse cx="950" cy="310" rx="410" ry="290" fill="url(#glow)"/>

  <circle cx="80" cy="66" r="4" fill="#FBBF24"/>
  <text x="102" y="71" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="2" fill="#A1A1AA">LARAVEL PACKAGE</text>

  <text x="80" y="280" font-family="Inter, system-ui, sans-serif" font-size="62" font-weight="800" letter-spacing="-2" fill="#FAFAFA">Laravel Queue</text>
  <text x="80" y="348" font-family="Inter, system-ui, sans-serif" font-size="62" font-weight="800" letter-spacing="-2" fill="#FAFAFA">Consumer</text>

  <text x="80" y="404" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#FBBF24">Dispatch queue jobs to a central hub</text>

  <text x="80" y="444" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#A1A1AA">No local worker per ephemeral environment —</text>
  <text x="80" y="468" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#A1A1AA">jobs POST to a central hub over HTTP.</text>

  <!-- terminal mock -->
  <rect x="680" y="160" width="420" height="330" rx="12" fill="#18181B" stroke="#27272A"/>
  <rect x="680" y="160" width="420" height="40" rx="12" fill="#0A0A0B"/>
  <rect x="680" y="188" width="420" height="12" fill="#0A0A0B"/>
  <circle cx="708" cy="180" r="6" fill="#EF4444"/>
  <circle cx="732" cy="180" r="6" fill="#F59E0B"/>
  <circle cx="756" cy="180" r="6" fill="#10B981"/>

  <text x="708" y="234" font-family="ui-monospace, monospace" font-size="15" fill="#FBBF24">$ dispatch(new GenerateInvoice)</text>
  <text x="708" y="264" font-family="ui-monospace, monospace" font-size="14" fill="#71717A">→ POST /api/jobs</text>
  <text x="708" y="290" font-family="ui-monospace, monospace" font-size="14" fill="#71717A">  X-Laravel-Queue-Token: ****</text>
  <text x="708" y="316" font-family="ui-monospace, monospace" font-size="14" fill="#10B981">← 202 Accepted {"id":"9b1f..."}</text>

  <line x1="708" y1="340" x2="1072" y2="340" stroke="#27272A"/>

  <text x="708" y="370" font-family="ui-monospace, monospace" font-size="15" fill="#FBBF24">$ queue-consumer:run --payload=…</text>
  <text x="708" y="400" font-family="ui-monospace, monospace" font-size="14" fill="#71717A">→ SyncJob::fire() through middleware()</text>
  <text x="708" y="426" font-family="ui-monospace, monospace" font-size="14" fill="#10B981">✓ job handled, exit 0</text>

  <!-- footer pills -->
  <g font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">
    <rect x="80" y="545" width="90" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="125" y="565" fill="#FAFAFA" text-anchor="middle">PHP 8.4</text>

    <rect x="184" y="545" width="104" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="236" y="565" fill="#FAFAFA" text-anchor="middle">Laravel 13</text>

    <rect x="302" y="545" width="70" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="337" y="565" fill="#FAFAFA" text-anchor="middle">Pest</text>

    <rect x="386" y="545" width="66" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="419" y="565" fill="#FAFAFA" text-anchor="middle">MIT</text>
  </g>

  <text x="1120" y="595" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#52525B">@jeffersongoncalves</text>
</svg>
